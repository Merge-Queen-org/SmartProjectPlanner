<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Delete project</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<main class="card">
  <h2>Are you sure you want to delete this project?</h2>

  <p class="delete-text">
    Deleting this project will also remove all its subprojects, tasks and related content.
    Once deleted, this action cannot be undone.
  </p>

  <p class="delete-text">If you're sure, you can continue below.</p>

  <div class="delete-buttons">
    <!-- tilbage uden at slette -->
    <a th:href="@{/projects}" class="button light">Cancel</a>

    <!-- sletter projektet -->
    <form th:action="@{/projects/{id}/delete(id=${project.projectId})}" method="post">
      <button class="button danger">Delete project</button>
    </form>
  </div>
</main>

</body>
</html>
