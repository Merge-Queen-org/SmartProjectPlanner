
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Edit Project - Smart Project Planner</title>

  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" th:href="@{/css/editProject.css}">
</head>

<body>

<header class="topbar">

  <a href="/" class="logo">
    <span class="dot">☰</span>
    Smart Project Planner
  </a>

  <a href="/projects">Projects</a>
  <a href="/">Home</a>

</header>

<main class="edit-container">

  <div class="edit-header">
    <h1>Edit Project</h1>
    <p>Update your project information below.</p>
  </div>

  <section class="edit-card">

    <form th:action="@{/projects/edit/{id}(id=${project.projectId})}"
          th:object="${project}"
          method="post">

      <div class="form-group">
        <label for="projectName">Project name</label>
        <input type="text"
               id="projectName"
               th:field="*{projectName}"
               required>
      </div>

      <div class="form-group">
        <label for="projectDescription">Description</label>
        <textarea id="projectDescription"
                  th:field="*{projectDescription}"
                  rows="4"></textarea>
      </div>

      <div class="form-group">
        <label for="projectDeadline">Deadline</label>
        <input type="date"
               id="projectDeadline"
               th:field="*{projectDeadline}"
               required>
      </div>

      <div class="form-actions">

        <a th:href="@{/projects}" class="cancel-button">
          Cancel
        </a>

        <button type="submit" class="save-button">
          Save changes
        </button>

      </div>

    </form>

  </section>

</main>

</body>
</html>
