<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create subproject - Smart Project Planner</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/subprojects.css}">
</head>

<body>

<header class="site-header">
    <div class="container">
        <a href="/" class="logo">
            <span class="dot">S</span>
            Smart Project Planner
        </a>

        <nav class="main-nav">
            <a href="/seeAllProjects" class="active">Projects</a>
            <a href="/">Home</a>
        </nav>
    </div>
</header>

<main>
    <div class="container page">

        <div class="page-header">
            <div>
                <h1>Create subproject</h1>
                <p class="page-subtitle" th:text="${project.projectName}">Website redesign</p>
            </div>
        </div>

        <form class="form-card"
              th:action="@{/projects/{id}/subprojects/create(id=${project.projectId})}"
              method="post">

            <label for="subprojectName">Name</label>
            <input type="text" id="subprojectName" name="subprojectName"
                   maxlength="100" required>

            <label for="subprojectDescription">Description</label>
            <textarea id="subprojectDescription" name="subprojectDescription"
                      maxlength="1000" rows="4"></textarea>

            <div class="project-card-actions">
                <button type="submit" class="btn btn-primary">Create subproject</button>
                <a th:href="@{/projects/{id}/subprojects(id=${project.projectId})}"
                   class="btn btn-secondary">Cancel</a>
            </div>

        </form>

    </div>
</main>

</body>
</html>
